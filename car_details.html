<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفاصيل السيارة - سوق السيارات</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .details-container { max-width: 800px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .details-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .price { color: #ff8c1a; font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="details-container">
            <a href="index.html" class="btn" style="margin-bottom:20px; display:inline-block;">← العودة للرئيسية</a>
            
            <img id="car-img" src="" class="details-img">
            <h2 id="car-name" style="color: #0b2b4a;"></h2>
            <p id="car-price" class="price"></p>
            
            <table>
                <tr><td>تاريخ الصناعة</td><td id="car-year"></td></tr>
                <tr><td>نوع الوقود</td><td id="car-fuel"></td></tr>
                <tr><td>الممشى (كم)</td><td id="car-mileage"></td></tr>
                <tr><td>ناقل الحركة</td><td id="car-transmission"></td></tr>
                <tr><td>حالة السيارة</td><td id="car-status"></td></tr>
                <tr><td>حالة البيع</td><td><span style="color: green; font-weight: bold;">متاحة للبيع ✅</span></td></tr>
            </table>

            <button onclick="alert( هذه نسخة HTML للعرض فقط. );" class="btn" style="background: #28a745; width: 100%; margin-top: 20px;">شراء هذه السيارة</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // فك تشفير البيانات
        document.getElementById( car-name ).textContent = decodeURIComponent(params.get( name ) ||  غير محدد );
        document.getElementById( car-price ).textContent = decodeURIComponent(params.get( price ) ||  غير محدد );
        document.getElementById( car-img ).src = decodeURIComponent(params.get( img ) ||   );
        document.getElementById( car-year ).textContent = decodeURIComponent(params.get( year ) ||  غير محدد );
        document.getElementById( car-fuel ).textContent = decodeURIComponent(params.get( fuel ) ||  غير محدد );
        document.getElementById( car-mileage ).textContent = decodeURIComponent(params.get( mileage ) ||  غير محدد );
        document.getElementById( car-transmission ).textContent = decodeURIComponent(params.get( transmission ) ||  غير محدد );
        document.getElementById( car-status ).textContent = decodeURIComponent(params.get( status ) ||  غير محدد );
    </script>
</body>
</html>
