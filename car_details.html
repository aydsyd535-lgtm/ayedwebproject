
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل السيارة - سوق السيارات</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container details-container">
        <a href="index.html" class="btn" style="margin-bottom: 20px;">← العودة للرئيسية</a>

        <div class="details-box">
            <img src="https://images.unsplash.com/photo-1592198084033-aade902d1aae?auto=format&fit=crop&w=600&q=80" alt="Ferrari" class="details-img">
            <h2 class="details-title">Ferrari F8 Tributo</h2>
            <p class="details-price">$280,000</p>
            
            <table class="details-table">
                <tr><td>تاريخ الصناعة</td><td>2023</td></tr>
                <tr><td>رقم اللوحة</td><td>F E R 001</td></tr>
                <tr><td>نوع الوقود</td><td>بنزين</td></tr>
                <tr><td>حالة السيارة</td><td>جديدة</td></tr>
                <tr><td>حالة البيع</td><td><span style="color: green; font-weight: bold;">متاحة للبيع ✅</span></td></tr>
            </table>

            <button onclick="alert( هذه نسخة HTML للعرض فقط. يرجى زيارة موقع الاستضافة للشراء الفعلي. );" class="btn" style="background: #28a745; width: 100%; margin-top: 20px;">شراء هذه السيارة</button>
        </div>
    </div>
</body>
</html>
