
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أضف سيارتك - سوق السيارات</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>🚗 سوق <span>السيارات</span></h1>
    </header>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="add_car.html">أضف سيارتك</a>
        <a href="login.html">تسجيل الدخول</a>
        <a href="register.html">إنشاء حساب</a>
        <a href="contact.html">تواصل معنا</a>
    </nav>

    <div class="form-box" style="max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1);">
        <a href="index.html" class="btn" style="margin-bottom: 20px; display: inline-block;">← العودة للرئيسية</a>
        
        <h2 style="text-align: center; color: #0b2b4a; margin-bottom: 20px;">إضافة سيارة جديدة</h2>
        
        <form onsubmit="event.preventDefault(); alert( ✅ تمت إضافة سيارتك بنجاح! (نسخة تجريبية) ); window.location.href= index.html ;">
            <div class="form-group">
                <label>اسم السيارة (الماركة والموديل):</label>
                <input type="text" placeholder="تويوتا كورولا 2024" required>
            </div>
            <div class="form-group">
                <label>السعر (بالدولار):</label>
                <input type="number" placeholder="25000" required>
            </div>
            <div class="form-group">
                <label>سنة الصنع:</label>
                <input type="number" placeholder="2024" required>
            </div>
            <div class="form-group">
                <label>نوع الوقود:</label>
                <select required>
                    <option value="">-- اختر --</option>
                    <option value="بنزين">بنزين</option>
                    <option value="ديزل">ديزل</option>
                    <option value="كهرباء">كهرباء</option>
                </select>
            </div>
            <div class="form-group">
                <label>الممشى (كم):</label>
                <input type="number" placeholder="50000" required>
            </div>
            <div class="form-group">
                <label>ناقل الحركة:</label>
                <select required>
                    <option value="Automatic">أوتوماتيك</option>
                    <option value="Manual">عادي (مانيوال)</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط صورة السيارة (URL):</label>
                <input type="text" placeholder="https://example.com/image.jpg" required>
            </div>
            <div class="form-group">
                <label>حالة السيارة:</label>
                <select required>
                    <option value="">-- اختر --</option>
                    <option value="جديدة">جديدة</option>
                    <option value="مستعملة">مستعملة</option>
                </select>
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 20px; padding: 15px; font-size: 1.2rem;">نشر الإعلان</button>
        </form>
    </div>

</body>
</html>
