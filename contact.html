<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السيارات - تواصل معنا</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🚗 سوق السيارات</h1>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="login.html">تسجيل الدخول</a>
            <a href="register.html">إنشاء حساب</a>
            <a href="contact.html">تواصل معنا</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-box" style="max-width: 500px;" id="contact">
            <h2>تواصل معنا</h2>
            <form>
                <div class="input-group">
                    <label>الاسم:</label>
                    <input type="text" placeholder="اكتب اسمك هنا" required>
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" placeholder="example@mail.com" required>
                </div>
                <div class="input-group">
                    <label>الرسالة / تفاصيل السيارة:</label>
                    <textarea rows="4" placeholder="اكتب استفسارك هنا..." required></textarea>
                </div>
                <button type="submit" class="btn">إرسال</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 - 2027 سوق السيارات - معرض Ayed. جميع الحقوق محفوظة.</p>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
